name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1' # toda segunda 09:00 UTC: pega CVE novo mesmo sem commit
  workflow_dispatch:

# Princípio do menor privilégio: o token do workflow só lê o repositório.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico inteiro: segredo apagado num commit antigo continua vazado
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  dependencias:
    name: Dependências (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts # --ignore-scripts: dependência maliciosa não roda código na instalação
      - run: npm audit --audit-level=high

  codigo:
    name: Código (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: semgrep
        run: |
          semgrep scan --error --metrics=off \
            --config p/javascript --config p/owasp-top-ten --config .semgrep/ \
            --exclude node_modules --exclude dist

  trivy:
    name: Dependências e config (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
