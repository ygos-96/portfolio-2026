version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions # mantém as próprias actions do pipeline atualizadas
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
